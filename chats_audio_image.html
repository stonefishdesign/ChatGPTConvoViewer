<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversations Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #f5f5f5;
        }

        .app {
            display: flex;
            height: 100vh;
            background-color: #ffffff;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 280px;
            background-color: #ffffff;
            border-right: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 20px 24px;
        }

        .new-archive-btn {
            width: 100%;
            background-color: #0b57d0;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px 0;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }

        .new-archive-btn:hover {
            background-color: #084298;
        }

        .section-label {
            padding: 0 24px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #868e96;
            letter-spacing: 0.5px;
        }

        .conversation-list {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .conversation-item {
            padding: 12px 24px;
            cursor: pointer;
            background-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #495057;
            transition: background-color 0.2s ease;
        }

        .conversation-item:hover {
            background-color: #f1f3f5;
        }

        .conversation-item.selected {
            background-color: #f4f5f7;
            border-left: 3px solid #0b57d0;
            color: #0b57d0;
            padding-left: 21px;
            /* Adjust for border */
        }

        .conversation-title {
            font-weight: 600;
            font-size: 0.9rem;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-item.selected .conversation-title {
            color: #0b57d0;
        }

        /* File Input Styles */
        .file-info {
            margin-top: 8px;
            font-size: 0.8rem;
            color: #6c757d;
            text-align: center;
        }

        /* Main Content Styles */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .conversation-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .conversation-header {
            padding: 24px 32px;
            background-color: #ffffff;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-shrink: 0;
        }

        .header-left h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #212529;
            font-weight: 700;
            margin-top: 0;
        }

        .conversation-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: #868e96;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .separator {
            color: #ced4da;
        }

        .header-right {
            display: flex;
            gap: 12px;
        }

        .export-button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background-color: #ffffff;
            color: #212529;
            border: 1px solid #ced4da;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .export-button:hover {
            background-color: #f8f9fa;
            border-color: #adb5bd;
        }

        /* Conversation Content Styles */
        .conversation-content {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            background-color: #ffffff;
            min-height: 0;
            position: relative;
            height: 100%;
            max-height: calc(100vh - 100px);
        }

        .conversation-tree {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .message-container {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .message-wrapper {
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .message-wrapper.user {
            align-items: flex-end;
        }

        .message-wrapper.assistant,
        .message-wrapper.system {
            align-items: flex-start;
        }

        .message-meta {
            font-size: 0.75rem;
            color: #868e96;
            margin-bottom: 8px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .role-name {
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .message-wrapper.user .role-name {
            color: #495057;
        }

        .message-wrapper.assistant .role-name,
        .message-wrapper.system .role-name {
            color: #0b57d0;
        }

        /* Message Styles */
        .message {
            box-shadow: none;
            max-width: 100%;
            margin: 0;
            padding: 16px 20px;
            border-radius: 8px;
        }

        .message.user {
            background-color: #e5e8fb;
            border: none;
            width: 100%;
        }

        .message.assistant {
            background-color: #ffffff;
            border: 1px solid #ced4da;
            width: 100%;
        }

        .message.system {
            background-color: transparent;
            border-left: 3px solid #868e96;
            padding-left: 20px;
            width: 100%;
        }

        .message-content {
            line-height: 1.6;
            font-size: 0.95rem;
            word-wrap: break-word;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            color: #212529;
        }

        .message.system .message-content {
            color: #6c757d;
            font-style: italic;
        }

        /* Branch Selector Styles */
        .branch-selector {
            margin-top: 8px;
            padding: 8px 12px;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 20px;
            display: inline-block;
        }

        .branch-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .branch-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .branch-button {
            padding: 4px 10px;
            border: 1px solid #dee2e6;
            background-color: #ffffff;
            color: #495057;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s ease;
            min-width: 60px;
        }

        .branch-button:hover {
            background-color: #f8f9fa;
            border-color: #adb5bd;
            transform: translateY(-1px);
        }

        .branch-button.active {
            background-color: #007bff;
            border-color: #007bff;
            color: #ffffff;
            font-weight: 500;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #6c757d;
            font-size: 1.2rem;
        }

        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007bff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Error State */
        .error {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #dc3545;
            font-size: 1.2rem;
            text-align: center;
            padding: 20px;
        }

        /* No Conversation State */
        .no-conversation {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #6c757d;
            font-size: 1.2rem;
        }

        /* Scrollbar Styling */
        .conversation-list::-webkit-scrollbar,
        .conversation-content::-webkit-scrollbar {
            width: 8px;
        }

        .conversation-list::-webkit-scrollbar-track,
        .conversation-content::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .conversation-list::-webkit-scrollbar-thumb,
        .conversation-content::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        .conversation-list::-webkit-scrollbar-thumb:hover,
        .conversation-content::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }

        /* Ensure branch selector aligns with the message */
        .message-container .branch-selector {
            align-self: flex-start;
            margin-left: 0;
        }

        .message-container .message.user+.branch-selector {
            align-self: flex-end;
            margin-right: 0;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .app {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                max-height: 200px;
            }

            .conversation-header {
                padding: 16px 20px;
            }

            .conversation-content {
                padding: 20px;
            }

            .branch-buttons {
                flex-direction: row;
            }

            .branch-selector {
                margin-top: 6px;
                padding: 6px 10px;
            }
        }

        /* Markdown content styles */
        .text-content {
            line-height: 1.6;
        }

        .text-content h1,
        .text-content h2,
        .text-content h3,
        .text-content h4,
        .text-content h5,
        .text-content h6 {
            margin: 16px 0 8px 0;
            color: inherit;
        }

        .text-content h1 {
            font-size: 1.5rem;
        }

        .text-content h2 {
            font-size: 1.3rem;
        }

        .text-content h3 {
            font-size: 1.1rem;
        }

        .text-content p {
            margin: 8px 0;
        }

        .text-content ul,
        .text-content ol {
            margin: 8px 0;
            padding-left: 24px;
        }

        .text-content li {
            margin: 4px 0;
        }

        .text-content blockquote {
            border-left: 4px solid #e9ecef;
            margin: 12px 0;
            padding: 8px 16px;
            background-color: #f8f9fa;
            font-style: italic;
        }

        .text-content code {
            background-color: #f8f9fa;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .text-content pre {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            margin: 12px 0;
        }

        .text-content pre code {
            background-color: transparent;
            padding: 0;
            border-radius: 0;
        }

        .text-content a {
            color: #007bff;
            text-decoration: none;
        }

        .text-content a:hover {
            text-decoration: underline;
        }

        .text-content strong {
            font-weight: 600;
        }

        .text-content em {
            font-style: italic;
        }

        /* Image styles */
        .image-content {
            margin: 8px 0;
        }

        .conversation-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 8px 0;
        }

        .image-error {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            color: #6c757d;
            font-size: 0.9rem;
        }

        /* Audio content styles */
        .audio-content {
            margin: 8px 0;
        }

        .conversation-audio {
            width: 100%;
            max-width: 400px;
            margin: 8px 0;
        }

        .audio-error {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            color: #6c757d;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="sidebar">
            <div class="sidebar-header">
                <input type="file" id="fileInput" accept=".html" style="display: none;">
                <button class="new-archive-btn" onclick="document.getElementById('fileInput').click()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    New Archive
                </button>
                <div class="file-info" id="fileInfo"></div>
            </div>
            <div class="conversation-list" id="conversationList">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    Select an HTML file to load conversations
                </div>
            </div>
        </div>

        <div class="main-content">
            <div id="conversationView">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    Loading conversations...
                </div>
            </div>
        </div>
    </div>

    <!-- Add Markdown library -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        class ConversationsViewer {
            constructor() {
                this.conversations = [];
                this.conversationSummaries = [];
                this.selectedConversation = null;
                this.selectedBranches = {};
                this.scrollPositions = {}; // Store scroll positions for each conversation
                this.assetsJson = {}; // Store asset mapping for images and audio

                this.init();
            }

            init() {
                this.setupFileInput();
                this.renderSidebar();
                this.renderConversationView();
            }

            setupFileInput() {
                const fileInput = document.getElementById('fileInput');
                fileInput.addEventListener('change', (event) => {
                    const file = event.target.files[0];
                    if (file) {
                        this.loadConversationsFromFile(file);
                    }
                });
            }

            async loadConversationsFromFile(file) {
                try {
                    this.showLoading();
                    const text = await file.text();

                    // Parse HTML content to extract jsonData and assetsJson
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(text, 'text/html');
                    const scripts = doc.querySelectorAll('script');

                    let jsonData = null;
                    let assetsJson = null;

                    // Extract jsonData and assetsJson from script tags
                    for (let i = 0; i < scripts.length; i++) {
                        const script = scripts[i];
                        const scriptContent = script.textContent;

                        // Look for jsonData in various formats
                        if (scriptContent.includes('jsonData')) {
                            // Try multiple extraction patterns
                            const patterns = [
                                /var jsonData = (\[[\s\S]*?\]);/,
                                /jsonData = (\[[\s\S]*?\]);/,
                                /var jsonData = (\[[\s\S]*?\]);/g,
                                /jsonData\s*=\s*(\[[\s\S]*?\]);/
                            ];

                            let extracted = false;
                            for (let pattern of patterns) {
                                const match = scriptContent.match(pattern);
                                if (match) {
                                    try {
                                        jsonData = JSON.parse(match[1]);
                                        extracted = true;
                                        break;
                                    } catch (e) {
                                        // Pattern matched but JSON parsing failed, try next method
                                    }
                                }
                            }

                            // If regex failed, try alternative extraction methods
                            if (!extracted) {
                                // Method 1: Find the line with "var jsonData = [" and extract everything after the equals sign
                                const lines = scriptContent.split('\n');
                                for (let j = 0; j < lines.length; j++) {
                                    const line = lines[j];
                                    if (line.includes('var jsonData = [') || line.includes('jsonData = [')) {
                                        // Extract everything after "jsonData = " or "var jsonData = "
                                        let jsonString = line.replace(/.*jsonData\s*=\s*/, '');

                                        // If the JSON spans multiple lines, we need to find the end
                                        if (!jsonString.includes('];')) {
                                            let braceCount = 0;

                                            for (let char of jsonString) {
                                                if (char === '[') braceCount++;
                                                if (char === ']') braceCount--;
                                            }

                                            // Continue from the next line if needed
                                            for (let k = j + 1; k < lines.length && braceCount > 0; k++) {
                                                const nextLine = lines[k];
                                                jsonString += nextLine;
                                                for (let char of nextLine) {
                                                    if (char === '[') braceCount++;
                                                    if (char === ']') braceCount--;
                                                }
                                            }
                                        }

                                        // Clean up the JSON string
                                        jsonString = jsonString.replace(/;$/, '');

                                        try {
                                            jsonData = JSON.parse(jsonString);
                                            extracted = true;
                                            break;
                                        } catch (e2) {
                                            // Try next method
                                        }
                                    }
                                }

                                // Method 2: Try to find JSON array boundaries more carefully
                                if (!extracted) {
                                    const jsonStart = scriptContent.indexOf('var jsonData = [');
                                    if (jsonStart === -1) {
                                        const altStart = scriptContent.indexOf('jsonData = [');
                                        if (altStart !== -1) {
                                            const jsonString = scriptContent.substring(altStart).replace(/.*jsonData\s*=\s*/, '');
                                            const jsonEnd = jsonString.indexOf('];');
                                            if (jsonEnd !== -1) {
                                                const cleanJson = jsonString.substring(0, jsonEnd + 1);
                                                try {
                                                    jsonData = JSON.parse(cleanJson);
                                                    extracted = true;
                                                } catch (e3) {
                                                    // Try next method
                                                }
                                            }
                                        }
                                    } else {
                                        const jsonString = scriptContent.substring(jsonStart).replace(/.*jsonData\s*=\s*/, '');
                                        const jsonEnd = jsonString.indexOf('];');
                                        if (jsonEnd !== -1) {
                                            const cleanJson = jsonString.substring(0, jsonEnd + 1);
                                            try {
                                                jsonData = JSON.parse(cleanJson);
                                                extracted = true;
                                            } catch (e3) {
                                                // Try next method
                                            }
                                        }
                                    }
                                }
                            }
                        }

                        // Look for assetsJson
                        if (scriptContent.includes('assetsJson')) {
                            const patterns = [
                                /var assetsJson = (\{[\s\S]*?\});/,
                                /assetsJson = (\{[\s\S]*?\});/,
                                /var assetsJson = (\{[\s\S]*?\});/g,
                                /assetsJson\s*=\s*(\{[\s\S]*?\});/
                            ];

                            let extracted = false;
                            for (let pattern of patterns) {
                                const match = scriptContent.match(pattern);
                                if (match) {
                                    try {
                                        assetsJson = JSON.parse(match[1]);
                                        extracted = true;
                                        break;
                                    } catch (e) {
                                        // Pattern matched but JSON parsing failed, try next method
                                    }
                                }
                            }

                            // If regex failed, try alternative extraction methods for assetsJson
                            if (!extracted) {
                                // Method 1: Find the line with "var assetsJson = {" and extract everything after the equals sign
                                const lines = scriptContent.split('\n');
                                for (let j = 0; j < lines.length; j++) {
                                    const line = lines[j];
                                    if (line.includes('var assetsJson = {') || line.includes('assetsJson = {')) {
                                        // Extract everything after "assetsJson = " or "var assetsJson = "
                                        let jsonString = line.replace(/.*assetsJson\s*=\s*/, '');

                                        // If the JSON spans multiple lines, we need to find the end
                                        if (!jsonString.includes('};')) {
                                            let braceCount = 0;

                                            for (let char of jsonString) {
                                                if (char === '{') braceCount++;
                                                if (char === '}') braceCount--;
                                            }

                                            // Continue from the next line if needed
                                            for (let k = j + 1; k < lines.length && braceCount > 0; k++) {
                                                const nextLine = lines[k];
                                                jsonString += nextLine;
                                                for (let char of nextLine) {
                                                    if (char === '{') braceCount++;
                                                    if (char === '}') braceCount--;
                                                }
                                            }
                                        }

                                        // Clean up the JSON string
                                        jsonString = jsonString.replace(/;$/, '');

                                        try {
                                            assetsJson = JSON.parse(jsonString);
                                            extracted = true;
                                            break;
                                        } catch (e2) {
                                            // Try next method
                                        }
                                    }
                                }

                                // Method 2: Try to find JSON object boundaries more carefully
                                if (!extracted) {
                                    const jsonStart = scriptContent.indexOf('var assetsJson = {');
                                    if (jsonStart === -1) {
                                        const altStart = scriptContent.indexOf('assetsJson = {');
                                        if (altStart !== -1) {
                                            const jsonString = scriptContent.substring(altStart).replace(/.*assetsJson\s*=\s*/, '');
                                            const jsonEnd = jsonString.indexOf('};');
                                            if (jsonEnd !== -1) {
                                                const cleanJson = jsonString.substring(0, jsonEnd + 1);
                                                try {
                                                    assetsJson = JSON.parse(cleanJson);
                                                    extracted = true;
                                                } catch (e3) {
                                                    // Try next method
                                                }
                                            }
                                        }
                                    } else {
                                        const jsonString = scriptContent.substring(jsonStart).replace(/.*assetsJson\s*=\s*/, '');
                                        const jsonEnd = jsonString.indexOf('};');
                                        if (jsonEnd !== -1) {
                                            const cleanJson = jsonString.substring(0, jsonEnd + 1);
                                            try {
                                                assetsJson = JSON.parse(cleanJson);
                                                extracted = true;
                                            } catch (e3) {
                                                // Try next method
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }

                    if (!jsonData) {
                        throw new Error('Could not find jsonData in HTML file.');
                    }

                    // Store the asset mapping for later use
                    this.assetsJson = assetsJson || {};

                    if (Array.isArray(jsonData)) {
                        this.conversations = jsonData;
                    } else if (jsonData.conversations) {
                        this.conversations = jsonData.conversations;
                    } else {
                        throw new Error('Invalid data format. Expected an array of conversations.');
                    }

                    // Preprocess conversations to rebuild 'children' arrays from 'parent' pointers if they are missing
                    this.conversations.forEach(conv => {
                        if (conv.mapping) {
                            Object.values(conv.mapping).forEach(node => {
                                if (!node.children) node.children = [];
                            });
                            Object.keys(conv.mapping).forEach(nodeId => {
                                const node = conv.mapping[nodeId];
                                if (node.parent && conv.mapping[node.parent]) {
                                    if (!conv.mapping[node.parent].children.includes(nodeId)) {
                                        conv.mapping[node.parent].children.push(nodeId);
                                    }
                                }
                            });
                        }
                    });

                    this.createConversationSummaries();
                    this.renderSidebar();
                    this.renderConversationView();
                    this.updateFileInfo(file.name, this.conversations.length);
                } catch (error) {
                    console.error('Failed to load conversations:', error);
                    this.showError(`Failed to load conversations: ${error.message}`);
                }
            }

            showLoading() {
                const conversationList = document.getElementById('conversationList');
                const conversationView = document.getElementById('conversationView');

                conversationList.innerHTML = `
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        Loading conversations...
                    </div>
                `;

                conversationView.innerHTML = `
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        Loading conversations...
                    </div>
                `;
            }

            updateFileInfo(filename, count) {
                const fileInfo = document.getElementById('fileInfo');
                fileInfo.innerHTML = `
                    ✅ Loaded: ${filename}<br>
                    📊 ${count} conversations
                `;
            }

            createConversationSummaries() {
                this.conversationSummaries = this.conversations.map(conversation => ({
                    id: conversation.id,
                    title: conversation.title,
                    create_time: conversation.create_time,
                    update_time: conversation.update_time
                }));
            }

            formatDate(timestamp) {
                const date = new Date(timestamp * 1000);
                return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }

            findPathToCurrentNode(mapping, current_node) {
                // Find the root node to start from
                let rootNode = mapping['client-created-root'];

                // If 'client-created-root' doesn't exist, find the first node without a parent
                if (!rootNode) {
                    const rootNodes = Object.values(mapping).filter(node =>
                        !node.parent || node.parent === null
                    );
                    if (rootNodes.length > 0) {
                        rootNode = rootNodes[0];
                    }
                }

                if (!rootNode) return {};

                // Find the current_node (user's last message)
                // First try to get it from conversation.current_node
                let targetNodeId = null;

                // If we have access to conversation.current_node, use that
                if (current_node && mapping[current_node]) {
                    targetNodeId = current_node;
                } else {
                    // Otherwise, find the last message in the mapping
                    const allNodeIds = Object.keys(mapping);
                    const lastNodeId = allNodeIds[allNodeIds.length - 1];
                    if (lastNodeId && mapping[lastNodeId] && mapping[lastNodeId].message) {
                        targetNodeId = lastNodeId;
                    }
                }

                if (!targetNodeId) return {};

                // Now find the path from root to this target node
                const path = [];
                let currentId = targetNodeId;

                // Trace back from target to root to find the complete path
                while (currentId && mapping[currentId]) {
                    const node = mapping[currentId];
                    if (node.parent) {
                        const parentNode = mapping[node.parent];
                        if (parentNode && parentNode.children) {
                            const branchIndex = parentNode.children.indexOf(currentId);
                            if (branchIndex !== -1) {
                                path.unshift({ nodeId: node.parent, branchIndex });
                            }
                        }
                        currentId = node.parent;
                    } else {
                        // Reached the root
                        break;
                    }
                }

                // Convert path to branch selections
                const branchSelections = {};
                path.forEach(({ nodeId, branchIndex }) => {
                    branchSelections[nodeId] = branchIndex;
                });

                return branchSelections;
            }

            renderSidebar() {
                const conversationList = document.getElementById('conversationList');

                if (this.conversationSummaries.length === 0) {
                    conversationList.innerHTML = `
                        <div class="loading">
                            <div class="loading-spinner"></div>
                            Select an HTML file to load conversations
                        </div>
                    `;
                    return;
                }

                conversationList.innerHTML = `
                    <div class="conversation-item ${!this.selectedConversation ? 'selected' : ''}" style="cursor: default;" onclick="conversationsViewer.selectConversation(null)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                            <path d="M3 3v5h5"></path>
                            <path d="M12 7v5l4 2"></path>
                        </svg>
                        <div class="conversation-title">All Conversations</div>
                    </div>
                ` + this.conversationSummaries.map(conversation => `
                    <div class="conversation-item ${this.selectedConversation?.id === conversation.id ? 'selected' : ''}" 
                         onclick="conversationsViewer.selectConversationById('${conversation.id}')">
                        <div class="conversation-title" style="font-size: 0.85rem; font-weight: normal; color: #495057;">${conversation.title}</div>
                    </div>
                `).join('');
            }

            selectConversationById(conversationId) {
                const conversation = this.conversations.find(c => c.id === conversationId);
                if (conversation) {
                    this.selectConversation(conversation);
                }
            }

            selectConversation(conversation) {
                // Save current scroll position for the current conversation
                if (this.selectedConversation) {
                    const conversationContent = document.querySelector('.conversation-content');
                    if (conversationContent) {
                        this.scrollPositions[this.selectedConversation.id] = conversationContent.scrollTop;
                    }
                }

                this.selectedConversation = conversation;
                this.selectedBranches = {};
                this.renderSidebar();
                this.renderConversationView();

                // Restore scroll position for the new conversation
                setTimeout(() => {
                    const newConversationContent = document.querySelector('.conversation-content');
                    if (newConversationContent && conversation) {
                        const savedPosition = this.scrollPositions[conversation.id] || 0;
                        newConversationContent.scrollTop = savedPosition;
                    }
                }, 0);
            }

            formatDateHeader(timestamp) {
                if (!timestamp) return '';
                return new Date(timestamp * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            }

            formatTimeAgo(timestamp) {
                if (!timestamp) return '';
                const diffInSeconds = Math.floor(Date.now() / 1000 - timestamp);
                if (diffInSeconds < 3600) return `${Math.max(1, Math.floor(diffInSeconds / 60))} minutes ago`;
                if (diffInSeconds < 86400) return `${Math.floor(diffInSeconds / 3600)} hours ago`;
                return this.formatDateHeader(timestamp);
            }

            renderConversationView() {
                const conversationView = document.getElementById('conversationView');

                if (!this.selectedConversation) {
                    conversationView.innerHTML = `
                        <div class="no-conversation">
                            <h2>Select a conversation to view</h2>
                        </div>
                    `;
                    return;
                }

                const conversationSummary = {
                    id: this.selectedConversation.id,
                    title: this.selectedConversation.title,
                    create_time: this.selectedConversation.create_time,
                    update_time: this.selectedConversation.update_time
                };

                conversationView.innerHTML = `
                    <div class="conversation-view">
                        <div class="conversation-header">
                            <div class="header-left">
                                <h1>${conversationSummary.title}</h1>
                                <div class="conversation-info">
                                    <span class="info-item">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                                        Last updated ${this.formatTimeAgo(conversationSummary.update_time)}
                                    </span>
                                </div>
                            </div>
                            <div class="header-right">
                                <button class="export-button" onclick="conversationsViewer.exportCurrentConversation()">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                                    Export
                                </button>
                            </div>
                        </div>
                        
                        <div class="conversation-content">
                            ${this.renderConversationTree()}
                        </div>
                    </div>
                `;
            }

            sanitizeFilename(name) {
                return (name || 'conversation').toString().replace(/[\/:*?"<>|]+/g, '_').slice(0, 120);
            }

            exportCurrentConversation() {
                try {
                    if (!this.selectedConversation) return;
                    const exportData = [this.selectedConversation];
                    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    const title = this.sanitizeFilename(this.selectedConversation.title);
                    a.href = url;
                    a.download = `${title || 'conversation'}.json`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(url);
                } catch (e) {
                    this.showError(`Failed to export conversation: ${e.message}`);
                }
            }

            renderConversationTree() {
                if (!this.selectedConversation || !this.selectedConversation.mapping) return '';

                // Find the path to current_node and determine correct branch selections
                const correctBranches = this.findPathToCurrentNode(this.selectedConversation.mapping, this.selectedConversation.current_node);

                // Only apply automatic branch selection if no branches have been manually selected
                const hasManualSelections = Object.keys(this.selectedBranches).length > 0;

                if (!hasManualSelections) {
                    // Only update if there are differences
                    const hasChanges = Object.keys(correctBranches).some(key =>
                        this.selectedBranches[key] !== correctBranches[key]
                    );

                    if (hasChanges) {
                        // Update all branch selections at once
                        Object.entries(correctBranches).forEach(([nodeId, branchIndex]) => {
                            this.selectedBranches[nodeId] = branchIndex;
                        });
                    }
                }

                const messages = [];
                let currentNode = this.selectedConversation.mapping['client-created-root'];

                // If 'client-created-root' doesn't exist, find the first node without a parent
                if (!currentNode) {
                    const rootNodes = Object.values(this.selectedConversation.mapping).filter(node =>
                        !node.parent || node.parent === null
                    );
                    if (rootNodes.length > 0) {
                        currentNode = rootNodes[0];
                    }
                }

                // Find the root message
                if (currentNode && currentNode.children && currentNode.children.length > 0) {
                    let currentId = currentNode.children[0];

                    // Navigate through the conversation tree
                    while (currentId && this.selectedConversation.mapping[currentId]) {
                        const node = this.selectedConversation.mapping[currentId];
                        if (node.message) {
                            messages.push({
                                ...node.message,
                                nodeId: currentId,
                                children: node.children || []
                            });
                        }

                        // Move to the next message based on selected branch or first child
                        if (node.children && node.children.length > 0) {
                            const selectedBranch = this.selectedBranches[currentId] || 0;
                            currentId = node.children[selectedBranch] || node.children[0];
                        } else {
                            break;
                        }
                    }
                }

                return `
                    <div class="conversation-tree">
                        ${messages.map((message, index) => `
                            <div class="message-container">
                                ${this.renderMessage(message)}
                                ${this.renderBranchSelector(message)}
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            renderMessage(message) {
                if (!message || !message.content) return '';

                const role = message.author?.role || 'unknown';



                // Filter out tool messages
                if ((role === 'tool' && message.content?.content_type !== 'multimodal_text') || role === 'system') {
                    return '';
                }

                // Handle different content structures safely
                let content = '';
                let contentType = message.content.content_type || 'text';

                if (message.content.parts && Array.isArray(message.content.parts)) {
                    // Handle multiple parts - combine text and images
                    const contentParts = message.content.parts.map((part, index) => {
                        if (typeof part === 'string') {
                            return `
                                <div class="text-content">
                                    ${marked.parse(part)}
                                </div>
                            `;
                        } else if (part && typeof part === 'object') {
                            // Handle image parts
                            if (part.content_type === 'image_asset_pointer' && part.asset_pointer) {
                                const assetPointer = part.asset_pointer;
                                let imageSrc = '';

                                // Try to find the image in the asset mapping first
                                if (this.assetsJson[assetPointer]) {
                                    imageSrc = `./${this.assetsJson[assetPointer]}`;
                                } else if (assetPointer.startsWith('file-service://')) {
                                    // Fallback to the original method
                                    const findImage = message.metadata?.attachments?.find(attachment => attachment.id === assetPointer.replace('file-service://', ''));
                                    if (findImage) {
                                        imageSrc = `./${findImage.id}-${findImage.name}`;
                                    }
                                }

                                if (imageSrc) {
                                    return `
                                        <div class="text-content">
                                            <div class="image-content">
                                                <img 
                                                    src="${imageSrc}" 
                                                    alt="Conversation image" 
                                                    class="conversation-image"
                                                    onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                                                />
                                                <div class="image-error" style="display: none;">
                                                    🖼️ Image: ${imageSrc.split('/').pop()}
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                } else {
                                    return `
                                        <div class="text-content">
                                            <div class="image-error">
                                                🖼️ Image not found: ${assetPointer}
                                            </div>
                                        </div>
                                    `;
                                }
                            } else if (part.content_type === 'audio_transcription') {
                                return `
                                    <div class="text-content">
                                        ${marked.parse(part.text)}
                                    </div>
                                `;
                            } else if (part.content_type === 'audio_asset_pointer' && part.asset_pointer) {
                                const assetPointer = part.asset_pointer;
                                let audioSrc = '';

                                // Try to find the audio file in the asset mapping
                                if (this.assetsJson[assetPointer]) {
                                    audioSrc = `./${this.assetsJson[assetPointer]}`;
                                } else if (assetPointer.startsWith('file-service://')) {
                                    // Fallback to the original method
                                    const findAudio = message.metadata?.attachments?.find(attachment => attachment.id === assetPointer.replace('file-service://', ''));
                                    if (findAudio) {
                                        audioSrc = `./${findAudio.id}-${findAudio.name}`;
                                    }
                                }

                                if (audioSrc) {
                                    return `
                                        <div class="text-content">
                                            <div class="audio-content">
                                                <audio 
                                                    controls 
                                                    class="conversation-audio"
                                                    onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                                                >
                                                    <source src="${audioSrc}" type="audio/wav">
                                                    <source src="${audioSrc}" type="audio/mpeg">
                                                    Your browser does not support the audio element.
                                                </audio>
                                                <div class="audio-error" style="display: none;">
                                                    🎵 Audio: ${audioSrc.split('/').pop()}
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                }
                            }
                            // Handle other part types if needed
                            return '';
                        }
                        return '';
                    }).filter(part => part !== ''); // Remove empty parts

                    // Combine all parts
                    if (contentParts.length > 0) {
                        content = contentParts.join('');
                    }
                } else if (typeof message.content === 'string') {
                    content = `
                        <div class="text-content">
                            ${marked.parse(message.content)}
                        </div>
                    `;
                } else if (message.content.text) {
                    content = `
                        <div class="text-content">
                            ${marked.parse(message.content.text)}
                        </div>
                    `;
                } else if (message.content && typeof message.content === 'object') {
                    // Handle case where content is an object with text property
                    if (message.content.text) {
                        content = `
                            <div class="text-content">
                                ${marked.parse(message.content.text)}
                            </div>
                        `;
                    }
                }

                // Append attachments from metadata
                if (message.metadata && message.metadata.attachments && Array.isArray(message.metadata.attachments)) {
                    const attachmentsHtml = message.metadata.attachments.map(attachment => {
                        const mime = attachment.mime_type || '';
                        let mediaTag = '';

                        let resolvedSrc = `./${attachment.id}.dat`;
                        if (this.assetsJson) {
                            const assetPointer = `file-service://${attachment.id}`;
                            if (this.assetsJson[assetPointer]) {
                                resolvedSrc = `./${this.assetsJson[assetPointer]}`;
                            } else if (this.assetsJson[attachment.id]) {
                                resolvedSrc = `./${this.assetsJson[attachment.id]}`;
                            }
                        }

                        if (mime.startsWith('image/')) {
                            mediaTag = `
                                <div class="image-content">
                                    <img src="${resolvedSrc}" onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='./${attachment.id}.dat';}else if(this.dataset.fb==1){this.dataset.fb=2;this.src='./${attachment.id}-${attachment.name}';}else{this.onerror=null;}" alt="${attachment.name}" class="conversation-image" style="max-width: 100%; height: auto; border-radius: 8px; margin: 8px 0;" />
                                </div>
                            `;
                        } else if (mime.startsWith('audio/')) {
                            mediaTag = `
                                <div class="audio-content">
                                    <audio controls class="conversation-audio" style="width: 100%; max-width: 400px; margin: 8px 0;" src="${resolvedSrc}" onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='./${attachment.id}.dat';}else if(this.dataset.fb==1){this.dataset.fb=2;this.src='./${attachment.id}-${attachment.name}';}else{this.onerror=null;}"></audio>
                                </div>
                            `;
                        }
                        return `
                            <div class="text-content attachment-block" style="margin-top: 12px; padding: 12px; background-color: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px;">
                                <div style="font-size: 0.9em; margin-bottom: ${mediaTag ? '8px' : '0'};">
                                    <a href="${resolvedSrc}" target="_blank" download="${attachment.name}" style="text-decoration: none; color: #007bff; display: flex; align-items: center; gap: 6px;">
                                        📎 <strong>${attachment.name}</strong> 
                                        <span style="color: #6c757d; font-size: 0.9em;">(${(attachment.size / 1024).toFixed(1)} KB)</span>
                                    </a>
                                </div>
                                ${mediaTag}
                            </div>
                        `;
                    }).join('');
                    content += attachmentsHtml;
                }

                // Filter out messages without meaningful content
                if (!content || content.trim() === '') return '';

                // Filter out contextual retry user messages (system messages)
                if (message.metadata?.is_contextual_retry_user_message === true) return '';

                const formattedDate = message.create_time ? this.formatDate(message.create_time) : '';
                return `
                    <div class="message-wrapper ${role}" title="${message.metadata?.model_slug || ''}">
                        <div class="message-meta">
                            ${role === 'assistant' || role === 'system' ? `
                                <span class="role-name">${role.toUpperCase()}</span>
                                <span class="timestamp">${formattedDate}</span>
                            ` : `
                                <span class="timestamp">${formattedDate}</span>
                                <span class="role-name">${role.toUpperCase()}</span>
                            `}
                        </div>
                        <div class="message ${role}">
                            <div class="message-content">${content}</div>
                        </div>
                    </div>
                `;
            }

            renderBranchSelector(message) {
                if (!message.children || message.children.length <= 1) return '';

                return `
                    <div class="branch-selector">
                        <div class="branch-indicator">
                            <div class="branch-buttons">
                                ${message.children.map((childId, childIndex) => {
                    const isSelected = this.selectedBranches[message.nodeId] === childIndex;
                    return `
                                        <button class="branch-button ${isSelected ? 'active' : ''}"
                                                onclick="conversationsViewer.selectBranch('${message.nodeId}', ${childIndex})">
                                            Response ${childIndex + 1}
                                        </button>
                                    `;
                }).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            selectBranch(messageNodeId, branchIndex) {
                // Save current scroll position for the current conversation
                if (this.selectedConversation) {
                    const conversationContent = document.querySelector('.conversation-content');
                    if (conversationContent) {
                        this.scrollPositions[this.selectedConversation.id] = conversationContent.scrollTop;
                    }
                }

                this.selectedBranches[messageNodeId] = branchIndex;
                this.renderConversationView();

                // Restore scroll position after rendering
                setTimeout(() => {
                    const newConversationContent = document.querySelector('.conversation-content');
                    if (newConversationContent && this.selectedConversation) {
                        const savedPosition = this.scrollPositions[this.selectedConversation.id] || 0;
                        newConversationContent.scrollTop = savedPosition;
                    }
                }, 0);
            }

            showError(message) {
                const conversationList = document.getElementById('conversationList');
                const conversationView = document.getElementById('conversationView');

                conversationList.innerHTML = `
                    <div class="error">
                        ${message}
                    </div>
                `;

                conversationView.innerHTML = `
                    <div class="error">
                        ${message}
                    </div>
                `;
            }
        }

        // Initialize the application
        const conversationsViewer = new ConversationsViewer();
    </script>
</body>

</html>
